name: Local Security Observatory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install observatory CLI
        run: python -m pip install -e .
      - name: Install scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          pipx install checkov
          pipx install medusa-security
          # Prefer pinned releases in production workflows.
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Run observatory scan
        run: security-scan --quick --fail-on high --json
