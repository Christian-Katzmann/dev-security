name: Local Security Observatory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install observatory CLI
        run: python -m pip install -e .
      - name: Install scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          pipx install checkov
          pipx install medusa-security
          # Pin install URLs to release tags; see .devsec/workflow-allowlist.yaml for justification.
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.44.0/install.sh | sudo sh -s -- -b /usr/local/bin v1.44.0
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/v0.112.0/install.sh | sudo sh -s -- -b /usr/local/bin v0.112.0
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/v8.30.1/install.sh | sudo sh -s -- -b /usr/local/bin v8.30.1
      - name: Run observatory scan
        run: security-scan --quick --fail-on high --json
