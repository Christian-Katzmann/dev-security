# Workflow audit allowlist for DëvSec scanning itself.
#
# Each entry suppresses a specific workflow-audit finding with a documented reason.
# The scanner's source-of-truth schema lives in src/security_observatory/surface_scanners.py
# (AllowlistEntry: rule, path, line?, reason). The matcher requires rule + path to match;
# `line` is an optional further filter and is omitted here so the entry covers the whole
# file rather than a specific line that would shift on edits.
#
# Rule reference:
#   workflow-fetch-exec          — pattern matches `curl|wget ... | sh` (fetch-and-execute)
#   workflow-unpinned-action     — `uses:` references a tag rather than a commit SHA
#   workflow-permissions-write   — workflow grants a write permission scope

entries:
  - rule: workflow-fetch-exec
    path: .github/workflows/security.yml
    reason: "Syft (v1.44.0), Grype (v0.112.0), and Gitleaks (v8.30.1) installers — URLs pinned to specific release tags, upstream-published, ephemeral CI runner only. The pinned tag prevents unilateral install-script drift; the curl|sh pattern is the upstream-documented install path."
